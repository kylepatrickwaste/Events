openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Route Events API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: districts
    description: District operations
  - name: events
    description: Route event operations
  - name: users
    description: Current-user and preference operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /login-name:
    get:
      operationId: getLoginName
      tags: [users]
      summary: Resolve the current user
      description: >-
        Returns the display name for the signed-in user plus their home
        district. Records the visit, creating the AppUsers row on first contact,
        so no separate registration step exists.
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginName"
  /home-district:
    put:
      operationId: setHomeDistrict
      tags: [users]
      summary: Pin the district the app opens into
      description: >-
        Sets the current user's home district, or clears it when districtNumber
        is omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetHomeDistrictRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginName"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /profile:
    put:
      operationId: updateProfile
      tags: [users]
      summary: Update the signed-in user's own profile
      description: >-
        Saves the current user's preferred name and home district together.
        Blank or omitted values clear the corresponding preference; a home
        district number that matches no active district is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginName"
        "400":
          description: Unknown home district number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List every application user
      description: >-
        The full roster, for the administration section of the profile dialog.
        Administrators only; everyone else gets 403. Unpaged — this table holds
        a district's agents, not customers.
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppUser"
        "403":
          description: Caller is not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /users/{id}:
    put:
      operationId: updateUser
      tags: [users]
      summary: Update another user's record
      description: >-
        Saves preferred name, home district, role and active status together.
        Administrators only. An administrator cannot remove their own admin
        access or deactivate themselves — that edit has no way back through the
        UI — and an unknown home district number is rejected rather than stored.
      parameters:
        - name: id
          in: path
          required: true
          description: AppUsers row id.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
        "400":
          description: Unknown district, unknown role, or self-demotion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: Caller is not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /districts:
    get:
      operationId: listDistricts
      tags: [districts]
      summary: List active districts
      responses:
        "200":
          description: Districts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/District"
  /districts/{districtId}/summary:
    get:
      operationId: getDistrictSummary
      tags: [districts]
      summary: Event counts and stats for a district
      parameters:
        - name: districtId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistrictSummary"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List route events for a district
      parameters:
        - name: districtId
          in: query
          required: true
          schema: { type: integer }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, closed, all]
        - name: eventTypeId
          in: query
          required: false
          schema: { type: integer }
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [all, severe, minimal]
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RouteEventListItem"
  /districts/{districtId}/service-codes:
    get:
      operationId: listDistrictServiceCodes
      tags: [districts]
      summary: List active service codes for a district
      parameters:
        - name: districtId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Service codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceCode"
  /event-types:
    get:
      operationId: listEventTypes
      tags: [events]
      summary: List event types
      responses:
        "200":
          description: Event types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventType"
  /districts/{districtId}/account-flags:
    get:
      operationId: listDistrictAccountFlags
      tags: [districts]
      summary: List flagged (contract) accounts for a district
      description: >-
        Administrators only; everyone else gets 403. Excluded accounts are an
        administrative concern, so agents have no way in from the UI and no way
        in from the API either.
      parameters:
        - name: districtId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Account flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountFlag"
        "403":
          description: Caller is not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /account-flags/{flagId}:
    delete:
      operationId: deleteAccountFlag
      tags: [districts]
      summary: Remove an account flag so its events reappear in the queue
      description: Administrators only; everyone else gets 403.
      parameters:
        - name: flagId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountFlag"
        "403":
          description: Caller is not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /events/bulk-close:
    post:
      operationId: bulkCloseEvents
      tags: [events]
      summary: Close multiple events at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCloseInput"
      responses:
        "200":
          description: Bulk close result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkCloseResult"
  /events/{eventId}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Full event detail with routes and actions
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteEventDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /events/{eventId}/notes:
    post:
      operationId: addEventNote
      tags: [events]
      summary: Add a note to an event
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Created action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /events/{eventId}/charge:
    post:
      operationId: chargeEvent
      tags: [events]
      summary: Charge the event to the customer's account
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChargeInput"
      responses:
        "201":
          description: Created action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /events/{eventId}/email:
    post:
      operationId: emailEvent
      tags: [events]
      summary: Send an email about this event
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailInput"
      responses:
        "201":
          description: Created action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /events/{eventId}/close:
    post:
      operationId: closeEvent
      tags: [events]
      summary: Close the event without charging
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseInput"
      responses:
        "201":
          description: Created action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
components:
  schemas:
    AppUser:
      type: object
      description: A row from the AppUsers table, as an administrator sees it.
      properties:
        id:
          type: integer
        activeDirectoryName:
          type: string
          description: The Windows / AD login, e.g. WCI\kyle.patrick.
        friendlyName:
          type: string
        homeDistrictNumber:
          type: string
        role:
          type: string
          description: Admin or Agent.
        active:
          type: boolean
          description: >-
            Whether the user is still on the active roster. A roster flag only —
            the API has no sign-in gate of its own, it trusts IIS.
        dateLastSeen:
          type: string
          format: date-time
      required:
        - id
        - activeDirectoryName
        - active
    UpdateUserRequest:
      type: object
      properties:
        friendlyName:
          type: string
          description: Preferred display name; blank clears it.
        homeDistrictNumber:
          type: string
          description: District Number to pin, or blank to clear.
        role:
          type: string
          description: >-
            Admin or Agent. Omitted leaves the existing role alone, so a client
            that does not know about roles cannot blank one out.
        active:
          type: boolean
      required:
        - active
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
          description: >-
            When the server answered. Always emitted; it was missing from this
            schema while the controller returned it.
        buildNumber:
          type: string
          description: >-
            Build number served from the repo-root buildinfo.txt. Optional so a
            server that has not been redeployed yet still satisfies the schema.
        environment:
          type: string
          description: >-
            ASP.NET Core environment name (Production, Development, Replit, …).
            The UI shows its DEVELOPMENT MODE banner whenever this is anything
            other than Production. Optional so a server that predates this field
            still satisfies the schema.
      required:
        - status
    LoginName:
      type: object
      properties:
        userName:
          type: string
          description: >-
            What the UI displays: the friendly name when the user has one,
            otherwise the raw AD login. Never empty.
        activeDirectoryName:
          type: string
          description: The Windows / AD login, e.g. WCI\kyle.patrick.
        friendlyName:
          type: string
        homeDistrictNumber:
          type: string
          description: >-
            District Number (not Id) the app should open straight into. Number
            rather than Id because the API re-seeds on every start and reassigns
            identity values.
        role:
          type: string
      required:
        - userName
        - activeDirectoryName
    SetHomeDistrictRequest:
      type: object
      properties:
        districtNumber:
          type: string
          description: District Number to pin, or omit to clear the home district.
    UpdateProfileRequest:
      type: object
      properties:
        friendlyName:
          type: string
          description: >-
            Preferred display name. Blank or omitted clears it, so the app falls
            back to showing the raw AD login.
        homeDistrictNumber:
          type: string
          description: >-
            District Number (not Id) to pin, or blank/omitted to clear the home
            district. Must match an active district.
    ErrorMessage:
      type: object
      properties:
        error: { type: string }
      required: [error]
    AccountFlag:
      type: object
      required: [id, districtId, accountNumber, flag, createdBy, dateCreated]
      properties:
        id: { type: integer }
        districtId: { type: integer }
        accountNumber: { type: string }
        flag: { type: string }
        createdBy: { type: string }
        dateCreated: { type: string }
    District:
      type: object
      required: [id, number, name, region, eventsCount]
      properties:
        id: { type: integer }
        number: { type: string }
        name: { type: string }
        region: { type: string }
        eventsCount: { type: integer }
    EventType:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    ServiceCode:
      type: object
      required: [id, districtId, code, description, amount]
      properties:
        id: { type: integer }
        districtId: { type: integer }
        code: { type: string }
        description: { type: string }
        amount: { type: number }
    DistrictSummary:
      type: object
      required: [districtId, openCount, closedCount, chargedToday, totalChargedAmount, byEventType]
      properties:
        districtId: { type: integer }
        openCount: { type: integer }
        closedCount: { type: integer }
        chargedToday: { type: integer }
        totalChargedAmount: { type: number }
        byEventType:
          type: array
          items:
            type: object
            required: [eventTypeId, eventTypeName, openCount]
            properties:
              eventTypeId: { type: integer }
              eventTypeName: { type: string }
              openCount: { type: integer }
    RouteEventListItem:
      type: object
      properties:
        id: { type: integer }
        districtId: { type: integer }
        eventTypeId: { type: integer }
        eventTypeName: { type: string }
        eventSourceName: { type: string }
        dateOccurred: { type: string }
        vehicle: { type: string }
        route: { type: string }
        customerName: { type: string }
        accountNumber: { type: string }
        address: { type: string }
        quantity: { type: ["number", "null"] }
        binSerialNumber: { type: ["string", "null"] }
        lob: { type: ["string", "null"] }
        stop: { type: ["string", "null"] }
        workOrderNumber: { type: ["string", "null"] }
        tabletNotes: { type: ["string", "null"] }
        chargedAmount: { type: ["number", "null"], description: "Total charged on this event" }
        prevChargeCount: { type: integer, description: "Number of prior charges on the account (before this event)" }
        prevChargeTotal: { type: number, description: "Total amount of prior charges on the account (before this event)" }
        imageUrl: { type: ["string", "null"] }
        imageUrls:
          type: array
          items: { type: string }
        severity: { type: ["string", "null"], description: "Severe | Minimal" }
        eventStatus: { type: integer, description: "0 = open, 1 = closed" }
        dateClosed: { type: ["string", "null"] }
        closedBy: { type: ["string", "null"] }
      required:
        [id, districtId, eventTypeId, eventTypeName, eventSourceName, dateOccurred, vehicle, route, customerName, accountNumber, address, eventStatus, imageUrls, prevChargeCount, prevChargeTotal]
    CustomerRoute:
      type: object
      required: [code, service, material, day]
      properties:
        code: { type: string }
        service: { type: string }
        material: { type: string }
        day: { type: string }
    EventAction:
      type: object
      required: [id, routeEventId, actionType, isFinal, createdBy, dateCreated]
      properties:
        id: { type: integer }
        routeEventId: { type: integer }
        actionType: { type: string }
        isFinal: { type: boolean }
        notes: { type: ["string", "null"] }
        closeReason: { type: ["string", "null"] }
        serviceCodeId: { type: ["integer", "null"] }
        chargeAmount: { type: ["number", "null"] }
        chargeQuantity: { type: ["number", "null"] }
        paymentStatus: { type: ["string", "null"], description: "PAID | REFUNDED | null (pending)" }
        createdBy: { type: string }
        dateCreated: { type: string }
    OverageStatistics:
      type: object
      required: [tenureMonths, customerSince, windows, lastChargeDate]
      properties:
        tenureMonths: { type: ["integer", "null"] }
        customerSince: { type: ["string", "null"] }
        lastChargeDate: { type: ["string", "null"] }
        windows:
          type: array
          items:
            type: object
            required: [days, eventsCount, chargedCount, chargedAmount, refundedCount, refundedAmount, netPaid]
            properties:
              days: { type: integer }
              eventsCount: { type: integer }
              chargedCount: { type: integer }
              chargedAmount: { type: number }
              refundedCount: { type: integer }
              refundedAmount: { type: number }
              netPaid: { type: number }
    NearbyEvent:
      type: object
      required: [id, dateOccurred, secondsOffset, eventStatus, status, distanceMeters, isSuggestedDuplicate]
      properties:
        id: { type: integer }
        imageUrl: { type: ["string", "null"] }
        dateOccurred: { type: string }
        secondsOffset: { type: integer, description: "seconds relative to the main event (negative = earlier)" }
        eventStatus: { type: integer, description: "0 = open, 1 = closed" }
        status: { type: string, description: "Open | Charged | Dismissed" }
        distanceMeters: { type: number, description: "great-circle distance from the main event in meters" }
        isSuggestedDuplicate: { type: boolean, description: "true when open and close enough in time/space to look like the same physical overage" }
        eventSourceName: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        customerName: { type: ["string", "null"] }
        accountNumber: { type: ["string", "null"] }
        binSerialNumber: { type: ["string", "null"] }
        vehicle: { type: ["string", "null"] }
    RecentCharge:
      type: object
      required: [id, dateCreated, amount, paymentStatus]
      properties:
        id: { type: integer }
        dateCreated: { type: string }
        amount: { type: number }
        paymentStatus: { type: ["string", "null"], description: "PAID | REFUNDED | null (pending)" }
    RouteEventDetail:
      type: object
      required: [id, districtId, eventTypeId, eventTypeName, eventSourceName, dateOccurred, vehicle, route, customerName, accountNumber, address, eventStatus, latitude, longitude, routes, actions, shareLinks, imageUrls, statistics, nearbyEvents, lastCharges]
      properties:
        id: { type: integer }
        districtId: { type: integer }
        eventTypeId: { type: integer }
        eventTypeName: { type: string }
        eventSourceName: { type: string }
        externalId: { type: ["string", "null"] }
        dateOccurred: { type: string }
        vehicle: { type: string }
        route: { type: string }
        customerName: { type: string }
        accountNumber: { type: string }
        address: { type: string }
        billArea: { type: ["string", "null"] }
        binSerialNumber: { type: ["string", "null"] }
        lob: { type: ["string", "null"] }
        rmoStatus: { type: ["string", "null"] }
        details: { type: ["string", "null"] }
        stop: { type: ["string", "null"] }
        workOrderNumber: { type: ["string", "null"] }
        tabletNotes: { type: ["string", "null"] }
        quantity: { type: ["number", "null"] }
        imageUrl: { type: ["string", "null"] }
        imageUrls:
          type: array
          items: { type: string }
        severity: { type: ["string", "null"], description: "Severe | Minimal" }
        latitude: { type: number }
        longitude: { type: number }
        eventStatus: { type: integer, description: "0 = open, 1 = closed" }
        dateClosed: { type: ["string", "null"] }
        closedBy: { type: ["string", "null"] }
        routes:
          type: array
          items:
            $ref: "#/components/schemas/CustomerRoute"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/EventAction"
        statistics:
          $ref: "#/components/schemas/OverageStatistics"
        nearbyEvents:
          type: array
          items:
            $ref: "#/components/schemas/NearbyEvent"
        lastCharges:
          type: array
          items:
            $ref: "#/components/schemas/RecentCharge"
        shareLinks:
          type: object
          required: [event, photo, source]
          properties:
            event: { type: string }
            photo: { type: string }
            source: { type: string }
    NoteInput:
      type: object
      required: [notes]
      properties:
        notes: { type: string, minLength: 1 }
    ChargeInput:
      type: object
      required: [serviceCodeId, amount, quantity]
      properties:
        serviceCodeId: { type: integer }
        amount: { type: number }
        quantity: { type: number }
        keepOpen: { type: boolean }
        duplicateEventIds:
          type: array
          items: { type: integer }
          description: "Nearby event IDs to dismiss as duplicates of the charged event"
    EmailInput:
      type: object
      required: [toType, to, subject]
      properties:
        toType: { type: string }
        to: { type: string }
        cc: { type: ["string", "null"] }
        subject: { type: string }
        body: { type: ["string", "null"] }
    CloseInput:
      type: object
      required: [closeReason]
      properties:
        closeReason: { type: string }
        notes: { type: ["string", "null"] }
        duplicateEventIds:
          type: array
          items: { type: integer }
          description: "Nearby event IDs to also close as duplicates"
    BulkCloseInput:
      type: object
      required: [eventIds, closeReason]
      properties:
        eventIds:
          type: array
          items: { type: integer }
          minItems: 1
        closeReason: { type: string }
        notes: { type: ["string", "null"] }
    BulkCloseResult:
      type: object
      required: [closedCount, skippedCount]
      properties:
        closedCount: { type: integer }
        skippedCount: { type: integer }
